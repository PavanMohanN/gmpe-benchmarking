[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmpe-bench"
version = "0.1.0"
description = "Hierarchical Spectral Conformal Prediction and Leakage-Free Open Benchmark for Ground Motion Models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pavan Mohan Neelamraju", email = "npavanmohan3@gmail.com" },
    { name = "S. T. G. Raghukanth", email = "raghukanth@iitm.ac.in" }
]
dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<4.0",
    "pyarrow>=14.0",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3,<2.0",
    "statsmodels>=0.14",
    "matplotlib>=3.7,<4.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "platformdirs>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
classical = ["pygmm==0.8.0"]
deep = ["torch>=2.1,<3.0"]
boost = ["xgboost>=2.0,<4.0"]
app = ["streamlit>=1.32,<2.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = ["gmpe-bench[classical,deep,boost,app,dev]"]

[project.scripts]
gmpe-bench = "gmpe_bench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gmpe_bench = ["reference/*.json", "app/assets/*.json", "app/assets/*.csv.gz", "app/assets/tables/*.csv"]
